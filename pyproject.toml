[project]
name = "7gc-os"
version = "0.1.0"
description = "7GC OS — Valuation Evidence Ledger"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # The schema suites talk to a remote Postgres, so they are network-bound
    # rather than CPU-bound and parallelise almost linearly. Every test seeds
    # uuid-suffixed ids and rolls back, so workers cannot see each other's rows.
    "pytest-xdist>=3.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    # The workbook reader is the only untyped third-party surface in the
    # project, and it is the layer that turns spreadsheet cells into money.
    "types-openpyxl>=3.1",
]

[tool.setuptools]
packages = ["api"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
# The oracle is deliberately independent of production code and is validated by
# evals/oracle/anchors.py rather than by types. See docs/ORACLE.md.
exclude = "^evals/oracle/"

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
# SERIAL. Not a performance preference — the parallel setting made this gate
# report failures that were not there, which is the one thing a gate may never
# do.
#
# It was `-n 4 --dist loadfile`, on the reasoning that wall clock here is
# round-trips to a remote database rather than computation, so workers wait
# rather than compete. The reasoning was sound and the measurement did not
# support it. Same tree, back to back:
#
#     -n 4 --dist loadfile    3 failed, 746 passed    21:11
#     -n 0                    749 passed              22:01
#
# Fifty seconds, for three failures that did not exist. The mechanism: several
# files seed the same FIXED ids (`fund_i`, `fund_ii`, `fund_ii_dream`) into one
# schema, so two workers insert the same row, one blocks, and Supabase's
# `statement_timeout` CANCELS the blocked insert — after which every dependent
# insert fails its foreign key. One cancelled statement became 124 errors in
# `test_document_load.py`.
#
# `tests/conftest.py` names this in writing: the advisory lock there serialised
# the corpus fixture against itself and "did nothing about
# `test_document_load.py` and `test_real_data_ledger.py`, which seed the same
# ids through the shared `conn` fixture". Both of those files are still in that
# state. The gap was known and its cost was not.
#
# `--dist loadgroup` with the colliding files grouped would keep the
# parallelism. It was not taken because it requires an accurate list of which
# files seed shared ids, and that list has already been got wrong once — the
# advisory lock covered one fixture and missed two files, which is precisely
# how today's failure happened. Serial removes the failure mode; grouping
# manages it, and the management drifts the next time someone seeds `fund_i`.
#
# The cost is ~4% of one gate run. The benefit is that a red gate means
# something, and nobody learns to re-run it until it turns green — which is
# bypassing the gate, in the one disguise that does not feel like bypassing.
#
# Set here rather than passed by hand so the gate, the pre-commit hook and CI
# all get it; the CI parity check enforces that they agree.
addopts = "-n 0"

[tool.coverage.run]
omit = ["evals/oracle/*"]
