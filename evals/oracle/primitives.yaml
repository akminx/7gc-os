# ── Management's own labels ──────────────────────────────────────────────
# A PRIMITIVE observation of what the tracker asserts — never the derived
# assessment label. Where the two disagree, that is a reconciliation finding
# (INV-4). Anthropic is the case: management calls the 25Q4 mark PRO FORMA, but
# no pro forma document exists — there is no document at all, only press.
tracker_labels:
  anthropic: {f2_25q4: [pro_forma], f2_26q1: [pro_forma]}

# ── Human/management decisions present in the corpus ─────────────────────
# Both are empty, and that is the point: the auditor asks for management
# assessments (PBC ¶3) and none exists, and no cross-class valuation policy has
# been recorded. derive.py must not invent either.
# Shape: {holding, date, status: draft|approved|superseded, mark_revision,
#          evidence_set_hash}. Only `approved` closes R3 (INV-18).
management_assessments: []

# Shape: {holding, date, method, citation}. Scoped per holding+date — a
# decision recorded for one position must not clear another (INV-17).
valuation_policy_decisions: []
# SPEC §6.3: sufficiency is a PREREQUISITE to valuation_approval, not the
# same thing. Empty here, so no fund-date may report an approved total.
# Shape: {holding, date, mark_revision, evidence_set_hash, policy_version}.
# Per MARK, not per fund-date: V3 requires every held member approved.
valuation_approvals: []

# ── Policy matrix — oracle-owned ─────────────────────────────────────────
# Scoped to cells this corpus exercises plus deliberate negatives, per the
# diagnosis review's cut list. An unenumerated tuple raises rather than
# defaulting: fail-closed, never a guess.
policy_matrix:
  - {req: R1, source_class: executed_transaction_doc,   execution_status: executed,              position_type: direct_equity,           verdict: sufficient}
  - {req: R1, source_class: administrator_statement,    execution_status: not_applicable,        position_type: indirect_feeder,         verdict: sufficient, note: "owner determination: administrator statement accepted as equivalent for a feeder interest"}
  - {req: R1, source_class: company_communication,      execution_status: non_binding,           position_type: direct_equity,           verdict: insufficient, reason: NON_BINDING_TERM_SHEET, next_action: REQUEST_EXECUTED_DOC}

  - {req: R2, source_class: executed_transaction_doc,   execution_status: executed,              position_type: direct_equity,           verdict: sufficient}
  - {req: R2, source_class: company_cap_table,          execution_status: pro_forma,             position_type: direct_equity,           verdict: partial,      reason: PRO_FORMA_PENDING_EXECUTION}
  - {req: R2, source_class: company_communication,      execution_status: unexecuted_referenced, position_type: direct_equity,           verdict: partial,      reason: CLOSING_SET_PENDING}
  - {req: R2, source_class: company_communication,      execution_status: non_binding,           position_type: direct_equity,           verdict: insufficient, reason: NON_BINDING_TERM_SHEET}
  - {req: R2, source_class: public_market_quote,        execution_status: not_applicable,        position_type: public_listed,           verdict: sufficient}
  - {req: R2, source_class: administrator_statement,    execution_status: not_applicable,        position_type: indirect_feeder,         verdict: sufficient}
  - {req: R2, source_class: third_party_valuation_memo, execution_status: not_applicable,        position_type: fx_denominated_interest, verdict: sufficient}
  - {req: R2, source_class: third_party_valuation_memo, execution_status: not_applicable,        position_type: direct_equity,           verdict: sufficient}
  - {req: R2, source_class: press,                      execution_status: not_applicable,        position_type: direct_equity,           verdict: insufficient, reason: PRESS_CANNOT_SUPPORT_FAIR_VALUE, next_action: REQUEST_PRIMARY_EVIDENCE}

  - {req: R4, source_class: executed_transaction_doc,   execution_status: executed,              position_type: direct_equity,           verdict: sufficient}

# Verdict when a requirement has no applicable evidence link, keyed by gap kind.
gap_verdicts:
  with_counsel:                    {verdict: partial,     next_action: REQUEST_FROM_COUNSEL}
  referenced_location_unspecified: {verdict: insufficient, next_action: REQUEST_WITH_LOCATION}
  not_located:                     {verdict: missing,     next_action: REQUEST_FROM_COMPANY}
  none:                            {verdict: missing,     next_action: REQUEST_FROM_COMPANY}
