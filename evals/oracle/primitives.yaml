  moonfare:       [{component: underlying_valuation, dates: ["2023-03-17"]},
                   {component: fx_rate, dates: ["2023-12-31", "2024-12-31"]}]
  sway:           [{component: valuation, dates: ["2023-10-18", "2025-09-30"]}]
  anthropic:      [{component: valuation, dates: ["2024-02-07"]}]
  lucra:          [{component: valuation, dates: ["2024-05-20", "2025-10-17"]}]
  poolside:       [{component: valuation, dates: ["2024-08-01"]}]
  fluidstack:     [{component: valuation, dates: ["2024-10-10", "2025-05-30", "2025-12-18"]}]
  dream:          [{component: valuation, dates: ["2025-11-14"]}]
  jackpocket:     [{component: valuation, dates: []}]
  capsule:        [{component: valuation, dates: ["2022-12-31"]}]
  mom_project:    [{component: equity_valuation, dates: ["2021-09-15"]},
                   {component: note_valuation, dates: []}]
