# Oracle primitives — hand-transcribed from source documents, pre-implementation.
#
# THIS FILE CONTAINS NO DERIVED VALUES.
# No row verdicts, no totals, no subtotals, no R3 applicability, no
# fully_supported flags, no pro_forma labels. Every one of those is computed by
# derive.py, which imports nothing from production code.
#
# The rule that produced this split (diagnosis review, 2026-07-24): two fixer
# cycles failed because ~200 hand-maintained derived cells drifted from the
# predicates stated elsewhere. Six of six unsupported subtotals were wrong, and
# the adversary reviewing them hand-computed one wrong too. Hand-maintained
# derived cells are unreliable regardless of who maintains them.
#
# Contentious judgements stay HERE as reviewed inputs: whether source language
# means with_counsel, whether a claim is authoritative, whether a document's
# applicability window closes. derive.py calculates consequences only.

