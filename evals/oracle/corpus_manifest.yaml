# ---------------------------------------------------------------------------
# UNCERTAINTY
#
# Recorded rather than resolved, because resolving any of it against the
# system's own output is the one thing this file must not do.
# ---------------------------------------------------------------------------

uncertainty:

  - id: field_names_are_mine
    concern: >-
      The `field` values here are my names for the concepts. Where the system
      uses different names, the mapping is an editorial decision. A name
      mismatch is not a value disagreement and must not be reported as one.

  - id: security_class_strings_are_verbatim
    concern: >-
      Class strings are transcribed as each document writes them, which means
      Fluidstack's "Series A Preferred Shares" (UK company, shares) and
      Poolside's "Series B Preferred Stock" differ in more than the letter.
      Fluidstack's Series B table writes the same classes as bare "Series A" and
      "Series A-2". Any comparison needs a normalisation rule, and I have not
      invented one.

  - id: holding_ids_are_guessed
    concern: >-
      NARROWED, not closed — see `join.holding_id`. Every fact, absence and lot
      now carries a composed `holding_id` of `{fund}_{holding}`, and the
      composition is evidenced rather than guessed. What is still a guess is the
      company slug for the three holdings whose display names carry extra words:
      The Mom Project, Jio (Indirect) and Banzai (Public). If a first comparison
      run leaves exactly those three unmatched and matches the other ten, it is
      the slug and not the figures.

  - id: moonfare_rounding
    concern: >-
      EUR 950,000 × 1.0526 = $999,970, and the FY2023 memo concludes $1,000,000
      "(USD, rounded)". If the system publishes 999970 it is not disagreeing with
      the source, it is disagreeing about whether to publish the conclusion or
      recompute it. Worth deciding once and saying which.

  - id: banzai_2023_date
    concern: >-
      The FY2023 quote is dated 12/29/2023, two days before the measurement date.
      I recorded both `as_of` (the observation) and `measurement_date`. If the
      system carries only one date field, one of the two is being lost, and which
      one it is matters to an auditor asking what was observed and when.

  - id: dream_and_lucra_two_sources
    concern: >-
      Dream's headline terms appear in both the cap table and the CFO's email;
      Fluidstack's A-2 price appears in both a table row and a note. Where two
      passages support one fact I recorded the stronger source as `source` and
      the other under `also_stated_in`. A comparison that demands exactly one
      source will report false disagreements on these.

  - id: sway_holders_total
    concern: >-
      Section 4's holders total is 20,000,000 A-3 shares, and Section 2's total
      fully diluted is 25,000,000 including common and the option pool. Both are
      right and they are different denominators. I did not record a percentage
      for Sway for that reason.

  - id: not_transcribed
    concern: >-
      Terms that cannot reach a reported number were left out on purpose, and so
      were the schedule rows of purchasers other than 7GC except where they serve
      as distractors. If a comparison finds cited facts with no manifest entry,
      the first question is whether they are in that excluded set rather than
      whether one of us is wrong.

  - id: this_file_is_not_the_answer_key
    concern: >-
      It is a second reading, taken independently. Where it disagrees with the
      system, EITHER may be wrong, and the resolution is to open the PDF and
      look. Editing this file to make a comparison pass destroys the only
      property that makes it worth having.
