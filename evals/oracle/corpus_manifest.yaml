# ---------------------------------------------------------------------------
# ABSENCES
#
# Facts that are real in the trackers, or one multiplication away from facts
# that are, but that NO document in this corpus states. A citation binding any
# of these to the named source is fabrication rather than a wrong passage, and
# it is the more dangerous of the two because there is no correct passage to
# compare against.
#
# These are also the rows that ¶1's "executed transaction documents" request
# lands on. Each one is a gap the packet must state, not a gap it should fill.
# ---------------------------------------------------------------------------

absences:

  - holding: because_market
    fund: fund_ii
    holding_id: fund_ii_because_market
    missing: "every document"
    detail: >-
      Because Market has no source document of any kind in
      02_Portfolio Documentation. Its share price (1.6), share count (625,000),
      entry valuation ($75M) and $1,000,000 cost exist ONLY in the Master
      Investment Breakdown, which records the supporting SPA as "not yet located
      in Drive — predates current recordkeeping". No cited fact for this holding
      can have a source, and a packet that shows nothing for it is correct.
    not_stated_in: []

  - holding: anthropic
    fund: fund_ii
    holding_id: fund_ii_anthropic
    field: fund_price_per_share
    not_stated_in: [anthropic_the_signal_article]
    detail: >-
      The article states no price per share. The tracker's $50 entry price
      appears nowhere in the corpus outside the tracker itself.

  - holding: anthropic
    fund: fund_ii
    holding_id: fund_ii_anthropic
    field: fund_shares
    not_stated_in: [anthropic_the_signal_article]
    detail: >-
      The article states no share count. The tracker's 40,000 appears nowhere
      else. The article does not mention 7GC at all.

  - holding: anthropic
    fund: fund_ii
    holding_id: fund_ii_anthropic
    field: concluded_fair_value_usd
    not_stated_in: [anthropic_the_signal_article]
    detail: >-
      The 8,000,000 mark at 25Q3 and 25Q4 is not stated or derivable from this
      document. Reaching it requires the tracker's cost and share count, an
      assumption that the reported valuation multiple applies per share, and a
      round number. The article supplies one of those three.

  - holding: anthropic
    fund: fund_ii
    holding_id: fund_ii_anthropic
    field: executed_entry_documents
    not_stated_in: []
    detail: >-
      The Master Breakdown asserts "Entry: executed subscription docs on file
      (Feb 2024)". No such document is in the corpus. ¶1's request for existence
      and cost is unanswered for this holding.

  - holding: fluidstack
    fund: fund_ii
    holding_id: fund_ii_fluidstack
    field: fund_aggregate_purchase_price
    security_class: "Series A-2"
    not_stated_in: [fluidstack_series_b_proforma, fluidstack_series_a_spa]
