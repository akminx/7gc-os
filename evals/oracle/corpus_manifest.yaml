text_layer_truncation:
  # Two term sheets have table rows whose text overflows the page and is cut in
  # the text layer. Verified with `pdftotext -layout`; the cut is in the PDF, not
  # in my reading of it. Any citation quote that continues past the cut cannot
  # resolve, and any extractor that reconstructs the missing tail is inventing it.
  - source: lucra_series_a1_term_sheet
    row: Valuation
    text_layer_ends_at: "including a post-closing unallocated option pool o"
    lost: "the remainder of the sentence"
  - source: lucra_series_a1_term_sheet
    row: Investors
    text_layer_ends_at: "existing investors and othe"
    lost: "the remainder of the investor list"
    survives_the_cut: "7GC Fund II, L.P. ($1,500,000)"
  - source: lucra_series_a1_term_sheet
    row: Protective provisions
    text_layer_ends_at: "and changes to"
    lost: "the remainder of the sentence"
    reaches_a_number: false
  - source: mom_project_series_c_term_sheet
    row: Investors
    text_layer_ends_at: "existing invest"
    lost: "the remainder of the investor list"
    survives_the_cut: "7GC Fund I, L.P. ($500,000 / 100,000 shares)"

near_duplicate_hazards:
  # Where a wrong-source citation is invisible to every internal-consistency
  # check, because the quote is verbatim in the wrong document too.
  - hazard: jio_statements_are_textually_identical
    sources: [jio_capital_account_2023, jio_capital_account_2024, jio_capital_account_2025]
    description: >-
      The three Jio capital account statements are identical in content apart
      from the as-of date in the subtitle. Every capital account figure — the
      commitment, the contributed capital, the distributions, the NAV, the
      unfunded commitment — is the same string in all three, and the Underlying
      Portfolio and Notes paragraphs are word for word the same.
    consequence: >-
      A NAV citation for 12/31/2023 that points at the 12/31/2024 statement
      resolves verbatim, matches its offsets, passes both triggers and exports
      cleanly. Nothing but the source identity distinguishes right from wrong,
      which is exactly the defect this manifest exists to catch. Any test built
      on this file MUST compare source identity and not merely quote text.
    only_discriminator: >-
      The line "Administrator to Horizon Access Fund IV (Jio Feeder), L.P. —
      Capital Account Statement — As of December 31, 20NN — Delivered via email
      to investor of record"
  - hazard: identical_values_within_one_document
    sources: [jackpocket_merger_notice, jio_capital_account_2023, jio_capital_account_2024, jio_capital_account_2025, moonfare_fx_memo_fy2024]
    description: >-
      Jackpocket states $3,100,000.00 twice, as gross consideration and as net
      payment. Each Jio statement states $1,000,000.00 three times, as
      commitment, contributed capital and NAV. The Moonfare FY2024 memo states
      $1,000,000 as the PRIOR carrying value on the line directly above the
      current one. In each case a citation can pick the wrong row and be
      numerically right, which makes the value check useless on its own and the
      passage check the only thing standing.
  - hazard: original_issue_price_beside_current_round_price
    sources: [fluidstack_series_b_proforma, dream_series_b_proforma, sway_series_a3_proforma]
    description: >-
      All three pro forma tables restate the historic issue price of older
      classes in a column headed "Orig. PPS" alongside the current round's price.
      Fluidstack's seven-row table holds $2.00, $10.00, $15.00 and $30.00 in one
      column; Dream's holds $0.75, $3.20 and $8.00; Sway's holds $0.90, $2.50
      and $0.40. The fund's own class is the older one in every case, so the
      passage nearest to the fund's name is the one that must NOT be read as a
      current price, and the current price is the one furthest from it.

