# Corpus manifest — hand-transcribed expectations for cited facts
#
# WHAT THIS IS FOR
#
# Everything else in this system verifies that text[span_start:span_end] equals
# citation_quote — in Python, in two plpgsql triggers, and again on export. All
# of that proves the offsets and the quote agree WITH EACH OTHER. None of it
# proves the quote is the RIGHT passage. An exporter can select a real but wrong
# passage, in a real document, and stay internally consistent through every one
# of those checks.
#
# This file is the artefact that can catch that. For each figure that can reach
# a reported number it states, independently, which source document says it,
# where in that document, and what the neighbouring passages say that would be
# wrong to cite.
#
# The `distractors` list on each fact is the load-bearing part. It names real
# passages, in real documents, that state the same number with a different
# meaning or a different number for an adjacent concept. Citing one of those is
# the failure mode this file exists to detect, and it is the one thing an
# extractor-derived manifest cannot supply, because an extractor that picked the
# distractor would record the distractor as the truth.
#
# INDEPENDENCE — the reason this is worth anything
#
# Transcribed by reading the source files under "7GC Audit Case Study/" and
# nothing else. While writing it I did not read demo.extracted_fact, any other
# database table of facts, evals/oracle/derived.json, evals/oracle/primitives.yaml,
# or anything under ingest/documents/. A manifest generated from the extractors
# agrees with itself and proves nothing; that shared-author error is what let 175
# oracle comparisons agree with a real defect in derive_mark.
#
# Consequence to accept deliberately: where this file disagrees with the system,
# EITHER may be wrong. A disagreement is a question, not a verdict, and the
# resolution is to open the PDF. Do not edit this file to make a comparison
# pass. If a value here is wrong, the fix is to re-read the source and correct
# it here with the reason recorded, exactly as evals/oracle/primitives.yaml is
# meant to be corrected.
#
# WHAT THIS DOES NOT CHECK
#
# - Character offsets. Those already have three guards and they are the part
#   that is internally consistent by construction. This file deliberately
#   asserts WHICH passage, never where it starts.
# - Whether a figure is the right basis for a valuation. "The Series B price is
#   $30.00 and 7GC's Series A-2 was issued at $15.00" is transcription; which of
#   them should price the 25Q4 mark is a valuation judgement and is not decided
#   here.
# - Which requirement a field answers. That is the FIELD_REQUIREMENT map, a
#   separate reviewed judgement.
#
# NOT WIRED INTO ANY TEST. See `comparison_contract` below for what a comparison
# would have to do; landing it is session A's call.

manifest_version: 1
transcribed_from: "7GC Audit Case Study/"
transcription_method: >-
  Each PDF read page-by-page (rendered text layer and page image together);
  the four .txt sources read directly; the two .xlsx trackers read cell by
  cell. Quoted passages were then re-checked against `pdftotext -layout`
  output so that the expected text is what a text layer actually yields.
  No value in this file was copied from any application output.

comparison_contract:
  # What a test built on this file would have to do. Written out so that
  # whoever wires it up does not have to guess at the intent.
  normalisation: >-
    Collapse every run of whitespace (including newlines) to a single space and
    strip, on BOTH sides, before comparing. The tables in this corpus are
    pdftotext -layout columnar output, so a row like the Jackpocket net-payment
    line carries 50+ spaces between label and value. Byte-exact comparison would
    fail on formatting and tell you nothing.
  characters: >-
    Counted across all 21 source files: 25 U+201C and 25 U+201D (typographic
    DOUBLE quotes), 48 ASCII apostrophes, and ZERO U+2019. The corpus mixes
    them — double quotes are curly, single quotes are straight — which is not
    what a reader assumes and is not what I assumed on the first pass. Seven
    passages in this file were wrong for exactly that reason and were corrected
    against the bytes. Em dashes are U+2014 and en dashes U+2013. Passages below
    carry the corpus characters verbatim; do not ASCII-fold one side only, and
    do not "tidy" an apostrophe in either direction.
  value_check: >-
    The system's value for (holding, field, security_class, as_of) must equal
    `value` here. Compare as numbers, not strings; `value_as_written` records the
    exact rendering for the passage check, not for arithmetic.
  passage_check: >-
    The system's citation_quote, normalised, must be a substring of `passage`,
    normalised. `passage` is deliberately a window rather than an exact quote:
    it is the span within which a correct citation must fall. A quote that is
    verbatim in the document but NOT inside this window is precisely the defect
    being hunted, and must fail.
  source_check: >-
    The system's cited source document must be the one named in `source`. This
    is the check the Jio statements exist to exercise — see
    `near_duplicate_hazards`.
  distractor_check: >-
    For each entry in `distractors`, if the system's citation for this fact
    matches that distractor passage, fail with the distractor's `why_wrong`
    text. A distractor hit is a more useful failure message than a plain
    mismatch, because it names what went wrong rather than that something did.
  absence_check: >-
    For each entry in `absences`, assert the system publishes NO cited fact of
    that (holding, field, security_class) sourced to `not_stated_in`. These are
    the fabrication cases: a figure that is real in the tracker, or arithmetically
    available, but that no document in the corpus states.
  expected_failure_mode: >-
    This file should be able to go red. If it can only pass, it is decoration.
    A mutation that repoints one citation at its own distractor — the Jackpocket
    gross row for net_payment is the cheapest — must make it fail.

join:
  # Lining the two lists up is a precondition for every check above, and getting
  # it wrong has a distinctive signature: EVERYTHING fails at once, uniformly.
  # That reads as "104 wrong numbers" and means "the pairs were never found".
  # A real defect is sparse — two or three rows. Read the shape before the rows.
  holding_id: >-
    Every fact, absence and lot carries `holding_id`, composed as
    `{fund}_{holding}` — `fund_ii_fluidstack`, `fund_i_mom_project`. The format
    is not a guess: the handoff records `GET /holdings/fund_ii_fluidstack`, and
    `fund.id` and `reporting_period.id` in the loaded demo schema follow the same
    shape (`fund_ii`, `fund_ii_24q4`). The COMPOSITION is therefore known; what
    remains uncertain is the company slug for the three holdings whose display
    names carry extra words — The Mom Project, Jio (Indirect) and Banzai
    (Public). If those three are the only unmatched rows, it is the slug and not
    the figures.
  reported_marks_rows: >-
    Deliberately NOT carrying `holding_id`: they sit under a `fund_ii:` or
    `fund_i:` block that already states the fund, and repeating it in the row
    would create two places for it to be wrong.
  field_name: >-
    STILL OPEN, and the cheap fix does not exist: `extracted_fact.field_name` is
    `text not null` in `0001_init.sql` — no enum, no CHECK constraint — so the
    schema does not enumerate the vocabulary. It lives in the extractors and in
    the fact rows, which is to say in the two places this manifest was written
    without reading. Whoever wires the comparison has already read them and
    should write the mapping; see `uncertainty.field_names_are_mine`.
  mapping_is_not_renaming: >-
    When that mapping is written, a manifest field with NO counterpart is a
    FINDING, not a chore. `original_issue_price` is the one to watch: mapping it
    onto a current-round price field would make the comparison pass by erasing
    the distinction that separates Fluidstack's 25Q4 mark of 6,000,000 from the
    2,500,000 the same table also supports. Record such a case as unmatched and
    ask whether the system does not extract the concept or has folded it into
    another — those are different answers and both need a person.

field_vocabulary:
  # These names are mine, chosen to read plainly. Where the system uses a
  # different name for the same concept the mapping is an editorial decision for
  # whoever wires this up; a name mismatch is NOT a value disagreement and must
  # not be reported as one.
  fund_shares: shares held by the 7GC entity, of the stated class
  fund_price_per_share: price per share the 7GC entity paid for its own lot
  fund_aggregate_purchase_price: total consideration the 7GC entity paid for its lot
  priced_security_class: the class of security the lot is
  agreement_date: the date the instrument states it is made/effective as of
  settlement_amount: funds confirmed received, per a settlement/wire confirmation
  settlement_date: the date those funds were confirmed received
  settlement_reference: the settlement/wire reference string
  round_price_per_share: the price per share of a financing round, whoever bought
  post_money_valuation: post-money valuation stated for a round
  pre_money_valuation: pre-money valuation stated for a round
  fully_diluted_shares: fully diluted share count stated for a round
  original_issue_price: a historic issue price of an EXISTING class, as restated
    in a later document — NOT a current-round price. Kept distinct on purpose;
    collapsing the two is the single most available wrong-passage error in this
    corpus.
  concluded_fair_value_per_share: a valuation specialist's concluded per-share value
  concluded_fair_value_usd: a valuation specialist's concluded value for the holding
  carried_amount: a figure read off the audited party's OWN memo — management's
    number, not an independently confirmed one
  net_asset_value: NAV of a capital account, per an administrator statement
  capital_commitment: committed capital, per an administrator statement
  contributed_capital: contributed capital inception to date
  distributions_to_date: distributions inception to date
  consideration_per_share: per-share merger consideration
  shares_of_record: shares of record at an effective time
  gross_consideration: gross merger consideration before deductions
  escrow_holdback: escrow / holdback allocation
  tax_withholding: tax withheld
  net_payment: amount actually payable after deductions
  fx_rate: a stated closing exchange rate
  foreign_currency_interest: the interest expressed in its own currency
  quoted_closing_price: a Level 1 quoted closing price
  position_value: a position value stated alongside a quoted price
  exchange_ratio: a recapitalisation conversion ratio

scope:
  covers: >-
    Figures that can reach a reported number: price per share, share counts,
    aggregate purchase prices, concluded values, net asset value, merger
    consideration, FX rates and the settlement limb of the letter's ¶1.
  excludes: >-
    Terms that cannot reach a reported number — dividend rates, board
    composition, no-shop periods, liquidation preference, protective provisions,
    OPM inputs (term, volatility, risk-free rate), percentage-of-class columns,
    and the schedule rows of purchasers other than 7GC. Several of those other
    purchasers' rows appear below as `distractors` rather than as facts, which
    is where their audit value is.
  counts:
    source_documents: 20
    internal_trackers: 2
    facts: 104
    facts_carrying_distractors: 37
    distractor_passages: 56
    absences: 14
    reported_marks: 72
    passages_verified_resolvable: 165
  counts_note: >-
    The brief asked for roughly 40-60 facts covering every number that can reach
    a packet. Covering them completely came to 104, because several holdings
    carry two lots, the settlement limb of ¶1 is a separate fact from the price
    it settles, and each near-duplicate value needs its own entry to have
    something to be distinguished from. The excess is coverage, not breadth: no
    fact here is outside `scope.covers`.
    The 72 reported marks were counted from the workbook, not taken from any
    prior report.

