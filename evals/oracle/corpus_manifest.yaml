      tracker. No document states it. Note (a) of the Series B table asserts the
      A-2 executed documents are "on file with company counsel", which is a
      statement that the evidence exists somewhere else.

  - holding: fluidstack
    fund: fund_ii
    holding_id: fund_ii_fluidstack
    field: settlement_amount
    security_class: "Series A-2"
    not_stated_in: [fluidstack_series_b_proforma]
    detail: >-
      There is a wire settlement confirmation for the Series A lot and none for
      the A-2 lot. ¶1's settlement limb is answered for one of the two Fluidstack
      lots.

  - holding: lucra
    fund: fund_ii
    holding_id: fund_ii_lucra
    field: fund_shares
    security_class: "Series A-1 Preferred Stock"
    not_stated_in: [lucra_series_a1_term_sheet, lucra_ceo_email_a2]
    detail: >-
      The tracker records 750,000 shares. The term sheet states 7GC's
      $1,500,000 commitment and a $2.00 price and NOTHING about a share count;
