# Render Blueprint — the service configuration lives in git, not in a dashboard.
#
# Create the service with New -> Blueprint and point it at this repo; every
# setting below is read from here. DATABASE_URL is marked sync:false because it
# is a credential: Render prompts for it once and never stores it in the repo.
#
# There is no database block here on purpose. Render's free Postgres expires
# after 30 days and is then deleted; Postgres is Supabase (SPEC §3.2).

services:
  - type: web
    name: 7gc-os-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -e .
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    # SPEC §3.2 — Render monitors READINESS, not the diagnostic /health. /health
    # returns 200 even when it reports `degraded`, so pointing the platform at
    # it meant a service whose database was gone still counted as healthy.
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # WHICH SCHEMA THE LEDGER IS IN. Not optional, and the default is wrong
      # for a deployment: `api.config.ledger_schema()` falls back to `public`,
      # which is the schema the test suites seed and roll back. Unset here, the
      # deployed API connected successfully, read `public`, and served the
      # residue of the one schema test that must commit — a dashboard listing
      # fund-periods named `fund_0b16fca2 / FY2025` and a 404 for the real
      # packet.
      #
      # `/ready` could not catch it: SPEC §3.2 locks it to `SELECT 1`, which is
      # exactly the right contract for "is the database reachable" and says
      # nothing about whether the right data is in it. A reachable, wrong
      # schema is a green health check over an empty demo.
      - key: LEDGER_SCHEMA
        value: demo
