# Render Blueprint — the service configuration lives in git, not in a dashboard.
#
# Create the service with New -> Blueprint and point it at this repo; every
# setting below is read from here. DATABASE_URL is marked sync:false because it
# is a credential: Render prompts for it once and never stores it in the repo.
#
# There is no database block here on purpose. Render's free Postgres expires
# after 30 days and is then deleted; Postgres is Supabase (SPEC §3.2).

services:
  - type: web
    name: 7gc-os-api
    runtime: python
    plan: free
    # `oregon`, and the database is `aws-0-us-east-1` — a deliberate mismatch
    # now rather than an unexamined one, so the reasoning is here instead of in
    # someone's memory.
    #
    # Every query in the deployed app crosses the continent. Measured from a
    # client at ~40 ms round trip to that database: responses under 1 KB cost a
    # stable 42 ms; responses of 10-50 KB cost anywhere from 47 ms to 2.4
    # seconds, which is TCP slow-start and congestion rather than query time.
    # Server-side execution of the heaviest retrieval query is 15 ms, and a
    # plain 28-row join is 0.10 ms. The database is never the cost; distance
    # multiplied by round trips is.
    #
    # `us-east` was considered and NOT taken. The reason it is unnecessary is
    # that the round trips came down instead: `GET .../packet` made 60 of them
    # and took 11.5 s, and after batching the N+1 in `api/ledger.py:claims_for`
    # it makes 19 — roughly two seconds deployed, which is the budget the owner
    # set. Moving regions would buy about 1.5 s more.
    #
    # If that stops being enough, the move is real work and not a config edit:
    # RENDER REGIONS ARE IMMUTABLE. Changing this line does not move the running
    # service, it declares a different one with a different URL, and the
    # frontend's `VITE_API_BASE_URL` has to follow it. Stand the new service up
    # ALONGSIDE the old, verify `/ready` AND that the page shows real figures —
    # `web/src/data.ts` falls back to the one-holding fixture when that variable
    # is unset, so a misconfigured deploy looks like a working app serving the
    # wrong data — and only then retire the old one.
    region: oregon
    branch: main
    buildCommand: pip install -e .
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    # SPEC §3.2 — Render monitors READINESS, not the diagnostic /health. /health
    # returns 200 even when it reports `degraded`, so pointing the platform at
    # it meant a service whose database was gone still counted as healthy.
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # WHICH SCHEMA THE LEDGER IS IN. Not optional, and the default is wrong
      # for a deployment: `api.config.ledger_schema()` falls back to `public`,
      # which is the schema the test suites seed and roll back. Unset here, the
      # deployed API connected successfully, read `public`, and served the
      # residue of the one schema test that must commit — a dashboard listing
      # fund-periods named `fund_0b16fca2 / FY2025` and a 404 for the real
      # packet.
      #
      # `/ready` could not catch it: SPEC §3.2 locks it to `SELECT 1`, which is
      # exactly the right contract for "is the database reachable" and says
      # nothing about whether the right data is in it. A reachable, wrong
      # schema is a green health check over an empty demo.
      - key: LEDGER_SCHEMA
        value: demo
      # WHETHER THIS DEPLOYMENT PAYS FOR PLAIN-ENGLISH RESTATEMENTS.
      #
      # `/holdings/{id}/explain` is the only route here that costs money per
      # request: every other one reads Postgres, this one calls a model. An
      # unauthenticated GET that spends money is a URL anyone can loop, so it is
      # off unless this says otherwise, and `/passages` — which is free and runs
      # no model at all — is unaffected either way.
      #
      # Its own key rather than DECISION_ACTORS below. Gating it on that reused
      # an existing switch and silently coupled two unrelated questions: turning
      # the assistant on would also have opened the decision-recording WRITE
      # surface on the public deployment.
      #
      # Declared here rather than left to the dashboard because both deployment
      # failures this feature has had were of one shape — something true on a
      # workstation that the repository never wrote down. A variable that gates
      # spending is the last one that should be invisible in the spec, and its
      # absence fails quietly: the pane 404s, which reads as "never built"
      # rather than "a setting was lost".
      - key: ASSISTANT_ENABLED
        sync: false
      # THE MODEL BEHIND THAT ROUTE. `sync: false`: a key never belongs in a
      # file that is committed. Absent, the restatement refuses in its own
      # words — "no model is configured" — rather than failing the request, so a
      # deployment that forgets it loses a paragraph and never a finding.
      - key: OPENROUTER_API_KEY
        sync: false
      # WHO MAY RECORD A DECISION. Unset, `api/decisions.py` refuses every write
      # with 403 and the frontend renders no control at all, which is how the
      # PUBLIC deployment stays read-only without the code having two versions.
      #
      # It is also how the best moment in the system stays switched off. With
      # actors named, trying to approve Anthropic's 8,000,000 valuation is
      # refused BY THE DATABASE — a Postgres constraint from
      # `0003_approval_prerequisites.sql`, not a form check — reporting that the
      # approval cites no sufficient existence-and-cost assessment. That single
      # click is the project's whole thesis, and a demo that cannot reach it is
      # showing the half that only reads.
      #
      # `sync: false` so the names are set in the Render dashboard rather than
      # committed here: these are people, and the repository is not where a
      # deployment's roster belongs.
      #
      # TWO VARIABLES, AND THEY MUST AGREE. The browser lists actors from
      # `VITE_DECISION_ACTORS` (built into the bundle, so it is a REBUILD and not
      # a restart) and sends the chosen one as `X-Actor-Id`; this variable is
      # what the API validates it against. Set one and not the other and the
      # control renders and every decision comes back 403 — which reads on
      # screen exactly like the constraint refusing an unsupported approval, and
      # is the one failure that would spoil the moment it exists to show.
      - key: DECISION_ACTORS
        sync: false
